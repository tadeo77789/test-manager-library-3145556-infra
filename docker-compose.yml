name: manager-library

# Infrastructure only: the database schema is owned by the API's Laravel
# migrations (ADR-001). This file must never contain DDL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-library}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "55433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - library_net

  api:
    build: ../api
    env_file:
      - path: .env
        required: true
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-library}
      DB_USERNAME: ${DB_USERNAME:-library}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: UTC
    ports:
      - "8000:8000"
    volumes:
      - covers_data:/var/www/storage/covers
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library_net

  app:
    build: ../app
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - library_net

volumes:
  db_data:
  covers_data:

networks:
  library_net:
    name: manager-library-net
